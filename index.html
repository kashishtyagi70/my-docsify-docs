<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
 
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">

	<style>
:root {
  --theme-color: #38bdf8;
}

/* FULL PAGE BACKGROUND */
body {
  background-color: #0b1120;
  color: #e2e8f0;
  font-family: "Segoe UI", sans-serif;
}

/* SIDEBAR */
.sidebar {
  background-color: #111827;
  border-right: 1px solid #1e293b;
}

.sidebar ul li a {
  color: #cbd5e1;
  font-size: 15px;
}

.sidebar ul li.active > a {
  color: #38bdf8;
  font-weight: 600;
}

/* SITE TITLE */
.app-name-link {
  color: #38bdf8 !important;
  font-weight: bold;
  font-size: 22px;
}

/* MAIN CONTENT AREA */
.content {
  background-color: #0b1120;
}

.markdown-section {
  max-width: 1000px;
  padding: 40px;
  color: #e2e8f0;
}

/* HEADINGS */
.markdown-section h1 {
  color: #38bdf8;
  border-bottom: 2px solid #1e293b;
  padding-bottom: 10px;
}

.markdown-section h2,
.markdown-section h3,
.markdown-section h4 {
  color: #60a5fa;
}

/* TEXT */
.markdown-section p,
.markdown-section li {
  color: #cbd5e1;
  line-height: 1.8;
}

/* LINKS */
.markdown-section a {
  color: #38bdf8;
}

.markdown-section a:hover {
  color: #7dd3fc;
}

/* CODE INLINE */
.markdown-section code {
  background: #111827;
  color: #38bdf8;
  border-radius: 6px;
  padding: 2px 6px;
}

/* CODE BLOCKS */
.markdown-section pre {
  background: #111827 !important;
  border: 1px solid #1e293b;
  border-radius: 12px;
  padding: 15px;
}

/* TABLES */
.markdown-section table {
  border-collapse: collapse;
  width: 100%;
}

.markdown-section th {
  background: #1e293b;
  color: #38bdf8;
}

.markdown-section td,
.markdown-section th {
  border: 1px solid #334155;
  padding: 12px;
}

/* BLOCKQUOTES */
.markdown-section blockquote {
  border-left: 4px solid #38bdf8;
  background: #111827;
  color: #cbd5e1;
  padding: 10px 20px;
}

/* SCROLLBAR */
::-webkit-scrollbar {
  width: 10px;
}

::-webkit-scrollbar-track {
  background: #0f172a;
}

::-webkit-scrollbar-thumb {
  background: #38bdf8;
  border-radius: 10px;
}

/* NAVBAR */
.github-corner svg {
  fill: #38bdf8 !important;
}

/* HR LINE */
.markdown-section hr {
  border-color: #1e293b;
}
</style>

</head>
<body>
  <div id="app"></div>
 <script>
     window.$docsify = {
     name: 'Cybrovate Documentation',
     repo: '',
     loadSidebar: true,
     subMaxLevel: 3,
     auto2top: true,
     }
</script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
 <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-powershell.min.js"></script>
 <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-yaml.min.js"></script>
</body>
</html>
