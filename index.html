<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cybrovate Documentation</title>

  <!-- Docsify Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">

  <style>

  :root {
    --theme-color: #38bdf8;
  }

  body {
    background-color: #0b1120;
    color: #e2e8f0;
    font-family: "Segoe UI", sans-serif;
  }

  .sidebar {
    background-color: #111827;
    border-right: 1px solid #1e293b;
  }

  .sidebar ul li a {
    color: #cbd5e1;
  }

  .sidebar ul li.active > a {
    color: #38bdf8;
    font-weight: 600;
  }

  .app-name-link {
    color: #38bdf8 !important;
    font-weight: bold;
    font-size: 28px;
  }

  .sidebar .app-name {
    opacity: 1 !important;
  }

  .content {
    background-color: #0b1120;
  }

  .markdown-section {
    color: #e2e8f0;
  }

  .markdown-section h1 {
    color: #38bdf8 !important;
  }

  .markdown-section h2,
  .markdown-section h3 {
    color: #60a5fa;
  }

  .markdown-section p,
  .markdown-section li {
    color: #cbd5e1;
  }

  .markdown-section pre {
    background: #111827 !important;
    border-radius: 10px;
  }

  </style>
</head>

<body>

  <div id="app">Loading...</div>

  <script>
    window.$docsify = {
      name: 'Cybrovate Documentation',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true
    }
  </script>

  <!-- Docsify -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>

</body>
</html>
