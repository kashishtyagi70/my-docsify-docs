<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cybrovate Documentation</title>

  <!-- DOCSIFY THEME -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">

  <!-- YOUR CUSTOM CSS -->
  <style>

  :root {
    --theme-color: #38bdf8;
  }

  body {
    background-color: #0b1120;
    color: #e2e8f0;
    font-family: "Segoe UI", sans-serif;
  }

  .sidebar {
    background-color: #111827;
    border-right: 1px solid #1e293b;
  }

  .sidebar ul li a {
    color: #cbd5e1;
  }

  .sidebar ul li.active > a {
    color: #38bdf8;
    font-weight: 600;
  }

  .markdown-section h1,
  .markdown-section h2,
  .markdown-section h3 {
    color: #38bdf8;
  }

/* H1 HEADINGS */
.markdown-section h1 {
  background-color: #0f172a;
  color: #38bdf8;

  padding: 15px 20px;
  border-radius: 12px;

  border-left: 5px solid #38bdf8;

  box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);

  margin-bottom: 30px;
}
.markdown-section h1 {
  color: #38bdf8 !important;
}
/* SITE TITLE */
.app-name-link {
  color: #38bdf8 !important;
  font-weight: 700;
  font-size: 28px;
  opacity: 1 !important;
}

/* REMOVE FADED EFFECT */
.sidebar .app-name {
  opacity: 1 !important;
}

  </style>

</head>

<body>

  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'Cybrovate Documentation',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>

</body>
</html>
