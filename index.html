<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cybrovate Documentation</title>

  <!-- Docsify Theme -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
<style>

:root {
  --theme-color: #3b82f6;

  --base-background-color: #0b1120;
  --base-color: #dbeafe;

  --sidebar-background: #111827;
  --sidebar-name-color: #60a5fa;
  --sidebar-nav-link-color: #cbd5e1;
  --sidebar-nav-link-color--active: #38bdf8;

  --content-max-width: 1100px;

  --code-inline-background: #111827;
  --code-theme-background: #111827;

  --table-row-odd-background: #0f172a;

  --selection-color: #1d4ed8;
}

/* BODY */
body {
  background: #0b1120;
  font-family: "Inter", "Segoe UI", sans-serif;
}

/* SIDEBAR */
.sidebar {
  border-right: 1px solid #1e293b;
}

/* LOGO/TITLE */
.app-name-link {
  font-size: 26px !important;
  font-weight: 700;
  color: #38bdf8 !important;

  letter-spacing: 0.5px;
}

/* SIDEBAR LINKS */
.sidebar ul li a {
  font-size: 15px;
  transition: 0.2s ease;
}

.sidebar ul li a:hover {
  color: #38bdf8;
  padding-left: 5px;
}

/* ACTIVE LINK */
.sidebar ul li.active > a {
  background: rgba(56,189,248,0.1);
  border-radius: 8px;
  padding: 6px 10px;
}

/* MAIN CONTENT */
.markdown-section {
  padding-top: 30px;
}

/* HEADINGS */
.markdown-section h1 {
  color: #60a5fa;
  font-size: 42px;
  font-weight: 700;

  border-bottom: 1px solid #1e293b;
  padding-bottom: 15px;
}

.markdown-section h2 {
  color: #38bdf8;
  margin-top: 50px;
}

.markdown-section h3 {
  color: #7dd3fc;
}

/* TEXT */
.markdown-section p,
.markdown-section li {
  color: #cbd5e1;
  line-height: 1.9;
  font-size: 16px;
}

/* LINKS */
.markdown-section a {
  color: #38bdf8;
}

/* CODE BLOCKS */
.markdown-section pre {
  border-radius: 14px;
  border: 1px solid #1e293b;

  box-shadow:
    0 0 0 1px rgba(56,189,248,0.05),
    0 8px 30px rgba(0,0,0,0.3);
}

/* INLINE CODE */
.markdown-section code {
  border-radius: 6px;
  padding: 3px 6px;
}

/* TABLES */
.markdown-section table {
  border-radius: 12px;
  overflow: hidden;
}

/* BLOCKQUOTES */
.markdown-section blockquote {
  background: #111827;
  border-left: 4px solid #38bdf8;

  border-radius: 8px;

  padding: 10px 20px;
}

/* SCROLLBAR */
::-webkit-scrollbar {
  width: 10px;
}

::-webkit-scrollbar-thumb {
  background: #2563eb;
  border-radius: 20px;
}

/* HERO GLOW */
.markdown-section h1,
.app-name-link {
  text-shadow:
    0 0 10px rgba(59,130,246,0.35);
}

</style>


 </head>

<body>

  <div id="app">Loading...</div>

<script>
window.$docsify = {
  name: 'Cybrovate Documentation',
  loadSidebar: true,
  subMaxLevel: 3,
  auto2top: true,

  alias: {
    '/.*/_sidebar.md': '/_sidebar.md'
  }
}
</script>

  <!-- Docsify -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-powershell.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs/components/prism-bash.min.js"></script>
</body>
</html>
